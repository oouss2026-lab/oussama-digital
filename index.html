<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#17142b">
<title>أسامة ديجيتال</title>

<style>
:root{
  --bg:#f5f6fa;
  --card:#fff;
  --text:#171c26;
  --muted:#70798a;
  --line:#e4e7ee;
  --primary:#5b4bdb;
  --primary2:#7869ed;
  --dark:#17142b;
  --success:#13845c;
  --danger:#c53d32;
  --shadow:0 10px 30px rgba(22,28,45,.08);
  --radius:18px;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Tahoma,Arial,sans-serif;
  line-height:1.7;
}

button,input,textarea,select{
  font:inherit;
}

button{
  cursor:pointer;
}

.topbar{
  position:fixed;
  top:0;
  right:0;
  left:0;
  height:72px;
  background:var(--dark);
  color:white;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 24px;
  z-index:1000;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  width:44px;
  height:44px;
  border-radius:13px;
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  display:grid;
  place-items:center;
  font-size:23px;
  font-weight:bold;
}

.brand h1{
  margin:0;
  font-size:18px;
}

.brand span{
  color:#bbb7ce;
  font-size:12px;
}

.menu-btn{
  display:none;
  border:0;
  background:none;
  color:white;
  font-size:28px;
}

.sidebar{
  position:fixed;
  top:72px;
  right:0;
  bottom:0;
  width:235px;
  background:#211d39;
  padding:20px 14px;
  z-index:900;
}

.nav{
  display:grid;
  gap:7px;
}

.nav button{
  width:100%;
  border:0;
  background:transparent;
  color:#d8d4e3;
  text-align:right;
  padding:13px 15px;
  border-radius:12px;
}

.nav button:hover,
.nav button.active{
  background:#352f56;
  color:white;
}

.main{
  margin-right:235px;
  padding:100px 28px 40px;
  max-width:1450px;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

.hero{
  background:linear-gradient(135deg,#201b3b,#3d3272);
  color:white;
  border-radius:24px;
  padding:32px;
  margin-bottom:22px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
}

.hero h2{
  margin:3px 0;
  font-size:30px;
}

.hero p{
  margin:4px 0;
  color:#ddd9e8;
}

.eyebrow{
  color:var(--primary);
  font-weight:bold;
  font-size:12px;
  margin:0;
}

.hero .eyebrow{
  color:#c3bbff;
}

.primary{
  border:0;
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  color:white;
  padding:11px 18px;
  border-radius:12px;
  font-weight:bold;
}

.primary:hover{
  opacity:.9;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:22px;
}

.stat{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:20px;
  box-shadow:var(--shadow);
}

.stat span{
  display:block;
  color:var(--muted);
  font-size:13px;
}

.stat strong{
  display:block;
  font-size:30px;
  margin-top:3px;
}

.panel{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:22px;
  margin-bottom:20px;
}

.panel-head,
.page-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:18px;
}

.page-head h2{
  margin:3px 0;
  font-size:30px;
}

.link-btn{
  border:0;
  background:none;
  color:var(--primary);
  font-weight:bold;
}

.toolbar{
  margin-bottom:18px;
}

.search{
  width:100%;
  padding:13px 15px;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--card);
  color:var(--text);
  outline:none;
}

.cards{
  display:grid;
  gap:13px;
}

.item{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:18px;
}

.item h3{
  margin:0 0 5px;
}

.item p{
  color:var(--muted);
  margin:0 0 8px;
}

.actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.action{
  border:1px solid var(--line);
  background:var(--card);
  color:var(--text);
  padding:7px 11px;
  border-radius:9px;
}

.action:hover{
  background:#f0effb;
}

.action.danger{
  color:var(--danger);
}

.badge{
  display:inline-block;
  padding:3px 9px;
  background:#e9f8f1;
  color:var(--success);
  border-radius:99px;
  font-size:11px;
}

.badge.gray{
  background:#eef0f4;
  color:#697386;
}

.empty{
  padding:35px;
  text-align:center;
  color:var(--muted);
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(10,8,20,.62);
  display:none;
  place-items:center;
  padding:18px;
  z-index:2000;
}

.modal.show{
  display:grid;
}

.modal-box{
  width:min(540px,100%);
  background:var(--card);
  color:var(--text);
  border-radius:20px;
  padding:25px;
  position:relative;
  box-shadow:0 25px 70px rgba(0,0,0,.3);
}

.modal-box h3{
  margin-top:0;
}

.close{
  position:absolute;
  left:15px;
  top:10px;
  border:0;
  background:none;
  color:var(--muted);
  font-size:29px;
}

.form{
  display:grid;
  gap:15px;
}

.form label{
  display:grid;
  gap:7px;
  font-weight:bold;
}

.form input,
.form textarea,
.form select{
  width:100%;
  padding:11px;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--card);
  color:var(--text);
}

.form textarea{
  min-height:100px;
  resize:vertical;
}

.toast{
  position:fixed;
  bottom:24px;
  left:50%;
  transform:translate(-50%,20px);
  background:#17142b;
  color:white;
  padding:11px 18px;
  border-radius:11px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:3000;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

@media(max-width:850px){

  .menu-btn{
    display:block;
  }

  .sidebar{
    transform:translateX(100%);
    transition:.25s;
    width:250px;
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .main{
    margin-right:0;
    padding:92px 15px 30px;
  }

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .hero{
    display:block;
    padding:24px;
  }

  .hero .primary{
    margin-top:18px;
  }

  .item{
    display:block;
  }

  .actions{
    margin-top:13px;
  }
}

@media(max-width:480px){

  .topbar{
    padding:0 14px;
  }

  .stats{
    gap:9px;
  }

  .stat{
    padding:14px;
  }

  .stat strong{
    font-size:23px;
  }

  .page-head{
    align-items:flex-start;
  }

  .page-head h2{
    font-size:25px;
  }

}
</style>
</head>

<body>

<header class="topbar">

  <div class="brand">
    <div class="logo">أ</div>

    <div>
      <h1>أسامة ديجيتال</h1>
      <span>منصة إدارة المشروع</span>
    </div>
  </div>

  <button class="menu-btn" id="menuBtn">☰</button>

</header>


<aside class="sidebar" id="sidebar">

  <nav class="nav">

    <button class="active" data-page="dashboard">
      🏠 الرئيسية
    </button>

    <button data-page="cases">
      📁 القضايا
    </button>

    <button data-page="lawyers">
      ⚖️ المحامون
    </button>

    <button data-page="archive">
      🗄️ الأرشيف
    </button>

    <button data-page="documents">
      📄 الوثائق
    </button>

    <button data-page="settings">
      ⚙️ الإعدادات
    </button>

  </nav>

</aside>


<main class="main">


<!-- DASHBOARD -->

<section class="page active" id="dashboard">

  <div class="hero">

    <div>

      <p class="eyebrow">مرحباً بك</p>

      <h2>لوحة التحكم</h2>

      <p>
        إدارة القضايا والوثائق والمحامين من مكان واحد.
      </p>

    </div>

    <button class="primary" data-action="new-case">
      + قضية جديدة
    </button>

  </div>


  <div class="stats">

    <div class="stat">
      <span>القضايا</span>
      <strong id="caseCount">0</strong>
    </div>

    <div class="stat">
      <span>المحامون</span>
      <strong id="lawyerCount">0</strong>
    </div>

    <div class="stat">
      <span>الوثائق</span>
      <strong id="documentCount">0</strong>
    </div>

    <div class="stat">
      <span>المتابعة</span>
      <strong id="taskCount">0</strong>
    </div>

  </div>


  <div class="panel">

    <div class="panel-head">

      <h3>آخر القضايا</h3>

      <button class="link-btn" data-page-link="cases">
        عرض الكل
      </button>

    </div>

    <div id="recentCases" class="empty">
      لا توجد قضايا بعد.
    </div>

  </div>

</section>



<!-- CASES -->

<section class="page" id="cases">

  <div class="page-head">

    <div>

      <p class="eyebrow">إدارة الملفات</p>

      <h2>القضايا</h2>

    </div>

    <button class="primary" data-action="new-case">
      + إضافة قضية
    </button>

  </div>


  <div class="toolbar">

    <input
      id="caseSearch"
      class="search"
      type="search"
      placeholder="ابحث عن قضية..."
    >

  </div>


  <div id="casesList" class="cards"></div>

</section>



<!-- LAWYERS -->

<section class="page" id="lawyers">

  <div class="page-head">

    <div>

      <p class="eyebrow">الفريق</p>

      <h2>المحامون</h2>

    </div>

    <button class="primary" data-action="new-lawyer">
      + إضافة محامٍ
    </button>

  </div>


  <div id="lawyersList" class="cards"></div>

</section>



<!-- ARCHIVE -->

<section class="page" id="archive">

  <div class="page-head">

    <div>

      <p class="eyebrow">المحفوظات</p>

      <h2>الأرشيف</h2>

    </div>

  </div>


  <div class="panel">

    <div id="archiveList" class="cards"></div>

  </div>

</section>



<!-- DOCUMENTS -->

<section class="page" id="documents">

  <div class="page-head">

    <div>

      <p class="eyebrow">الملفات</p>

      <h2>الوثائق</h2>

    </div>

    <button class="primary" data-action="new-document">
      + إضافة وثيقة
    </button>

  </div>


  <div class="panel">

    <div id="documentsList" class="cards"></div>

  </div>

</section>



<!-- SETTINGS -->

<section class="page" id="settings">

  <div class="page-head">

    <div>

      <p class="eyebrow">النظام</p>

      <h2>الإعدادات</h2>

    </div>

  </div>


  <div class="panel">

    <form id="settingsForm" class="form">

      <label>

        اسم المنصة

        <input
          id="siteName"
          value="أسامة ديجيتال"
        >

      </label>


      <button class="primary" type="submit">
        حفظ الإعدادات
      </button>

    </form>

  </div>

</section>

</main>



<!-- MODAL -->

<div class="modal" id="modal">

  <div class="modal-box">

    <button class="close" id="closeModal">
      ×
    </button>

    <h3 id="modalTitle">
      إضافة
    </h3>


    <form id="modalForm" class="form">

    </form>

  </div>

</div>



<div class="toast" id="toast"></div>



<script>

/* =========================
   DATA
========================= */

const state = {

  cases:
    JSON.parse(
      localStorage.getItem("ouss_cases") || "[]"
    ),

  lawyers:
    JSON.parse(
      localStorage.getItem("ouss_lawyers") || "[]"
    ),

  documents:
    JSON.parse(
      localStorage.getItem("ouss_documents") || "[]"
    )

};



/* =========================
   HELPERS
========================= */

const $ = selector =>
  document.querySelector(selector);


const $$ = selector =>
  [...document.querySelectorAll(selector)];


function saveData(){

  localStorage.setItem(
    "ouss_cases",
    JSON.stringify(state.cases)
  );

  localStorage.setItem(
    "ouss_lawyers",
    JSON.stringify(state.lawyers)
  );

  localStorage.setItem(
    "ouss_documents",
    JSON.stringify(state.documents)
  );

}


function escapeHTML(value){

  return String(value || "").replace(
    /[&<>"']/g,

    character => ({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"

    })[character]

  );

}


function showToast(message){

  const toast = $("#toast");

  toast.textContent = message;

  toast.classList.add("show");

  setTimeout(() => {

    toast.classList.remove("show");

  },2200);

}



/* =========================
   NAVIGATION
========================= */

function showPage(page){

  $$(".page").forEach(section => {

    section.classList.toggle(
      "active",
      section.id === page
    );

  });


  $$(".nav button").forEach(button => {

    button.classList.toggle(
      "active",
      button.dataset.page === page
    );

  });


  $("#sidebar").classList.remove("open");

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


document.addEventListener("click",event => {

  const button =
    event.target.closest("[data-page]");

  if(button){

    showPage(button.dataset.page);

  }


  const link =
    event.target.closest("[data-page-link]");

  if(link){

    showPage(link.dataset.pageLink);

  }

});



/* =========================
   MODAL
========================= */

function openModal(type){

  const titles = {

    case:"إضافة قضية",

    lawyer:"إضافة محامٍ",

    document:"إضافة وثيقة"

  };


  $("#modalTitle").textContent =
    titles[type];


  let extra = "";


  if(type === "case"){

    extra = `

      <label>

        الحالة

        <select name="status">

          <option>قيد المتابعة</option>

          <option>مكتملة</option>

          <option>معلقة</option>

        </select>

      </label>

    `;

  }


  $("#modalForm").innerHTML = `

    <label>

      الاسم

      <input
        name="name"
        required
        autofocus
      >

    </label>


    <label>

      التفاصيل

      <textarea
        name="details"
        placeholder="أدخل التفاصيل..."
      ></textarea>

    </label>


    ${extra}


    <button
      class="primary"
      type="submit"
    >
      حفظ
    </button>

  `;


  $("#modalForm").dataset.type = type;

  $("#modal").classList.add("show");

}


function closeModal(){

  $("#modal").classList.remove("show");

}


$("#closeModal").addEventListener(
  "click",
  closeModal
);


$("#modal").addEventListener(
  "click",
  event => {

    if(event.target.id === "modal"){

      closeModal();

    }

  }
);


document.addEventListener(
  "keydown",
  event => {

    if(event.key === "Escape"){

      closeModal();

    }

  }
);



/* =========================
   ADD
========================= */

$("#modalForm").addEventListener(
  "submit",
  event => {

    event.preventDefault();


    const form =
      new FormData(event.currentTarget);


    const type =
      event.currentTarget.dataset.type;


    const item = {

      id:Date.now().toString(),

      name:
        form.get("name"),

      details:
        form.get("details") || "",

      status:
        form.get("status") || "",

      archived:false,

      createdAt:
        new Date().toISOString()

    };


    if(type === "case"){

      state.cases.push(item);

    }


    if(type === "lawyer"){

      state.lawyers.push(item);

    }


    if(type === "document"){

      state.documents.push(item);

    }


    saveData();

    render();

    closeModal();

    showToast("تمت الإضافة بنجاح");

  }
);



/* =========================
   ACTION BUTTONS
========================= */

document.addEventListener(
  "click",
  event => {

    const action =
      event.target.closest("[data-action]");


    if(!action) return;


    const type =
      action.dataset.action;


    if(type === "new-case"){

      openModal("case");

    }


    if(type === "new-lawyer"){

      openModal("lawyer");

    }


    if(type === "new-document"){

      openModal("document");

    }

  }
);



/* =========================
   DELETE / ARCHIVE
========================= */

document.addEventListener(
  "click",
  event => {

    const button =
      event.target.closest("[data-act]");


    if(!button) return;


    const id =
      button.dataset.id;


    const action =
      button.dataset.act;


    if(action === "delete"){

      const type =
        button.dataset.type;


      let array;


      if(type === "case"){

        array = state.cases;

      }

      else if(type === "lawyer"){

        array = state.lawyers;

      }

      else{

        array = state.documents;

      }


      const index =
        array.findIndex(
          item => item.id === id
        );


      if(index !== -1){

        if(confirm("هل تريد حذف هذا العنصر؟")){

          array.splice(index,1);

          saveData();

          render();

          showToast("تم الحذف");

        }

      }

    }


    if(action === "archive"){

      const item =
        state.cases.find(
          item => item.id === id
        );


      if(item){

        item.archived =
          !item.archived;


        saveData();

        render();

        showToast(
          item.archived
            ? "تمت الأرشفة"
            : "تم إلغاء الأرشفة"
        );

      }

    }

  }
);



/* =========================
   CARD
========================= */

function createCard(item,type){

  const archived =
    item.archived
      ? `<span class="badge gray">مؤرشفة</span>`
      : "";


  const status =
    item.status
      ? `<span class="badge">
          ${escapeHTML(item.status)}
        </span>`
      : "";


  let archiveButton = "";


  if(type === "case"){

    archiveButton = `

      <button
        class="action"
        data-act="archive"
        data-id="${item.id}"
      >

        ${
          item.archived
            ? "إلغاء الأرشفة"
            : "أرشفة"
        }

      </button>

    `;

  }


  return `

    <article class="item">

      <div>

        <h3>
          ${escapeHTML(item.name)}
        </h3>

        <p>
          ${escapeHTML(item.details)}
        </p>

        ${status}

        ${archived}

      </div>


      <div class="actions">

        ${archiveButton}


        <button
          class="action danger"
          data-act="delete"
          data-type="${type}"
          data-id="${item.id}"
        >

          حذف

        </button>

      </div>

    </article>

  `;

}



/* =========================
   RENDER
========================= */

function render(){

  const activeCases =
    state.cases.filter(
      item => !item.archived
    );


  $("#caseCount").textContent =
    activeCases.length;


  $("#lawyerCount").textContent =
    state.lawyers.length;


  $("#documentCount").textContent =
    state.documents.length;


  $("#taskCount").textContent =
    activeCases.filter(
      item =>
        item.status === "قيد المتابعة"
    ).length;



  const search =
    ($("#caseSearch")?.value || "")
      .trim()
      .toLowerCase();


  const filtered =
    activeCases.filter(item => {

      const name =
        String(item.name || "")
          .toLowerCase();


      const details =
        String(item.details || "")
          .toLowerCase();


      return !search ||
        name.includes(search) ||
        details.includes(search);

    });


  $("#casesList").innerHTML =
    filtered.length

      ? filtered
          .slice()
          .reverse()
          .map(
            item =>
              createCard(item,"case")
          )
          .join("")

      : `<div class="empty">
          لا توجد قضايا مطابقة.
        </div>`;



  const recent =
    activeCases
      .slice()
      .reverse()
      .slice(0,3);


  $("#recentCases").innerHTML =
    recent.length

      ? recent
          .map(
            item =>
              createCard(item,"case")
          )
          .join("")

      : `<div class="empty">
          لا توجد قضايا بعد.
        </div>`;



  const archived =
    state.cases.filter(
      item => item.archived
    );


  $("#archiveList").innerHTML =
    archived.length

      ? archived
          .slice()
          .reverse()
          .map(
            item =>
              createCard(item,"case")
          )
          .join("")

      : `<div class="empty">
          الأرشيف فارغ.
        </div>`;



  $("#lawyersList").innerHTML =
    state.lawyers.length

      ? state.lawyers
          .slice()
          .reverse()
          .map(
            item =>
              createCard(item,"lawyer")
          )
          .join("")

      : `<div class="empty">
          لا يوجد محامون بعد.
        </div>`;



  $("#documentsList").innerHTML =
    state.documents.length

      ? state.documents
          .slice()
          .reverse()
          .map(
            item =>
              createCard(item,"document")
          )
          .join("")

      : `<div class="empty">
          لا توجد وثائق بعد.
        </div>`;

}



/* =========================
   SEARCH
========================= */

$("#caseSearch").addEventListener(
  "input",
  render
);



/* =========================
   MOBILE MENU
========================= */

$("#menuBtn").addEventListener(
  "click",
  () => {

    $("#sidebar").classList.toggle(
      "open"
    );

  }
);



/* =========================
   SETTINGS
========================= */

const savedName =
  localStorage.getItem(
    "ouss_site_name"
  );


if(savedName){

  $("#siteName").value =
    savedName;

  document.title =
    savedName;

}


$("#settingsForm").addEventListener(
  "submit",
  event => {

    event.preventDefault();


    const name =
      $("#siteName").value.trim();


    if(!name){

      showToast(
        "اكتب اسم المنصة أولاً"
      );

      return;

    }


    localStorage.setItem(
      "ouss_site_name",
      name
    );


    document.title =
      name;


    showToast(
      "تم حفظ الإعدادات"
    );

  }
);



/* =========================
   START
========================= */

render();

</script>

</body>
</html>
